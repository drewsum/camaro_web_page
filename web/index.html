<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1968 Camaro SS</title>
    <!-- Every scene shows the Camaro, so start its download (and the Draco
         decoder it needs) alongside the JavaScript instead of after it runs.
         crossorigin matches three's fetch() so the browser reuses these. -->
    <link rel="preload" href="/models/camaro.glb" as="fetch" type="model/gltf-binary" crossorigin="anonymous" />
    <link rel="preload" href="/draco/draco_wasm_wrapper.js" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/draco/draco_decoder.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
