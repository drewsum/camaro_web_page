server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Hashed build output never changes for a given filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Unhashed filename: revalidate every load (ETag makes unchanged models a 304).
    location /models/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /draco/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
