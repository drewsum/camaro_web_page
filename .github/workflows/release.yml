# GitOps: every push to main builds the image, pushes it to GHCR, commits the new tag into
# deploy/portainer-compose.yml, and moves the `deploy` branch to that commit. Portainer tracks
# `deploy`, not main, so it only ever sees commits whose image exists: it never redeploys
# onto a tag that hasn't finished building. No Watchtower needed.
#
# No loops: the tag bump is pushed with GITHUB_TOKEN (whose pushes never trigger workflows),
# says [skip ci], and runs by github-actions[bot] are skipped anyway.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/drewsum/camaro-web

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point the deploy stack at the new image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sed -i -E "s#(ghcr\.io/drewsum/camaro-web):(sha-[0-9a-f]+|latest)\b#\1:${TAG}#" deploy/portainer-compose.yml
          grep -q "camaro-web:${TAG}" deploy/portainer-compose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/portainer-compose.yml
          git commit -m "deploy: ${TAG} [skip ci]"
          # Another push may have landed while the image built; the bump only touches one line.
          for _ in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              # Only this workflow writes `deploy`, and runs are serialised, so it's always
              # the latest bump; --force because it's a pointer, not a history.
              git push --force origin HEAD:refs/heads/deploy
              exit 0
            fi
            sleep 5
          done
          exit 1
